version: "3.8"

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trae-core
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/data/logs
    networks:
      - trae-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: trae-mysql
    ports:
      - "${DB_PORT}:${DB_PORT}"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - trae-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

networks:
  trae-network:
    driver: bridge
